          <!-- Alarm Seçimi Bitiş -->


<div class="row justify-content-center g-1">
  <!-- Tarih Seçimi -->
 <!-- Tarih Seçimi -->
 <div class="col-6 col-md-6">

  <!-- Saat Etiketleri -->
<!-- Saat Etiketleri -->
<div class="col-12" style="display: none;">
  <div
    id="timeTags"
    class="d-flex flex-nowrap overflow-auto gap-2 px-2 py-2 bg-white border rounded-3 shadow-sm"
    style="min-height: 50px; white-space: nowrap;">
  </div>
  <input type="hidden" id="selectedTimes" name="selectedTimes">
</div>


</div>



          <!-- Başlat Butonu -->

                class="btn w-100 py-3 rounded-3 shadow text-white instagram-btn"

        <div class="row mt-4 mb-5"> </div>


    <!-- Button trigger modal -->


  <!-- Modal Başlangıç -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header position-relative">
            <h1 class="modal-title fs-5 text-center w-100" id="exampleModalLabel">Bilgi Ekranı</h1>
            <button type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-3" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

        <div class="modal-body text-center">
            <!-- ... -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger w-100" data-bs-dismiss="modal">KAPAT</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal Bitiş -->
  <script>
    let uploadedFiles = [];
    const selectedTimes = [];

    // Resim önizleme ve silme
    document.getElementById('upload').addEventListener('change', function (e) {
        const preview = document.getElementById('previewArea');
        const maxFiles = 10;
        const newFiles = [...e.target.files];

        if (uploadedFiles.length + newFiles.length > maxFiles) {
            alert("En fazla 10 resim yükleyebilirsiniz.");
            return;
        }

        newFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const card = document.createElement('div');
                card.className = 'preview-card card border-0 shadow-sm text-center flex-shrink-0 position-relative';
                card.style.width = '160px';

                card.innerHTML = `
                  <img src="${e.target.result}" class="card-img-top" style="height: 110px; object-fit: cover;" alt="preview">
                  <div class="card-body p-2 text-center">
                    <small class="text-muted text-truncate d-block" title="${file.name}">${file.name}</small>
                  </div>
                  <button type="button" class="btn btn-sm btn-outline-danger bg-danger text-white position-absolute top-0 end-0 m-1 rounded-circle" aria-label="Sil">
                    <i class="bi bi-x-lg"></i>
                  </button>
                `;

                card.querySelector('.btn-outline-danger').addEventListener('click', () => {
                    preview.removeChild(card);
                    uploadedFiles = uploadedFiles.filter(f => f !== file);
                });

                preview.appendChild(card);
            };
            reader.readAsDataURL(file);
            uploadedFiles.push(file);
        });

        this.value = '';
    });

    // Zaman etiketleri
    function addTime() {
        const timeInput = document.getElementById("timeInput");
        const timeValue = timeInput.value;

        if (timeValue && !selectedTimes.includes(timeValue)) {
            selectedTimes.push(timeValue);
            updateTimeTags();
            document.getElementById("selectedTimes").value = JSON.stringify(selectedTimes);
            timeInput.value = "";
        }
    }

    function removeTime(index) {
        selectedTimes.splice(index, 1);
        updateTimeTags();
        document.getElementById("selectedTimes").value = JSON.stringify(selectedTimes);
    }

    function updateTimeTags() {
        const container = document.getElementById("timeTags");
        container.innerHTML = "";

        if (selectedTimes.length === 0) {
            container.parentElement.style.display = "none";
            return;
        }

        container.parentElement.style.display = "block";

        selectedTimes.forEach((time, index) => {
            const tag = document.createElement("span");
            tag.className = "badge rounded-pill bg-danger px-3 py-2 d-inline-flex align-items-center";
            tag.innerHTML = `
              ${time}
              <button type="button" class="btn-close btn-close-white btn-sm ms-2" aria-label="Sil" onclick="removeTime(${index})"></button>
            `;
            container.appendChild(tag);
        });
    }



    // Form gönderimi ve doğrulama
    document.getElementById('AgentsForm').addEventListener('submit', function (e) {
        e.preventDefault();

        let errors = [];

        const fields = [
            { id: 'IgUserId', name: 'Instagram Kullanıcı ID' },
            { id: 'AccessToken', name: 'Access Token' },
            { id: 'SystemPrompt', name: 'Sistem Prompt' },
            { id: 'UserPrompt', name: 'Kullanıcı Prompt' },
            { id: 'date', name: 'Tarih' }
        ];

        fields.forEach(field => {
            const el = document.getElementById(field.id);
            if (!el || el.value.trim() === '' || el.value === null) {
                errors.push(field.name);
            }
        });

        // Paylaşım türü kontrolü
        const shareTypeSelect = document.getElementById('shareTypeSelect');
        if (!shareTypeSelect || shareTypeSelect.selectedIndex === 0) {
            errors.push('Paylaşım Türü (Alarm Seçimi)');
        }

        // Resim kontrolü artık zorunlu değil
        // if (uploadedFiles.length === 0) {
        //     errors.push('En az bir görsel yükleyin');
        // }

        // Zaman etiketi kontrolü
        if (!Array.isArray(selectedTimes) || selectedTimes.length === 0) {
            errors.push('En az bir zaman etiketi (Saat) ekleyin');
        }

        const modalBody = document.querySelector('#exampleModal .modal-body');
        const modal = new bootstrap.Modal(document.getElementById('exampleModal'));

        if (errors.length > 0) {
            modalBody.innerHTML = `
                <div class="alert alert-danger text-start" role="alert">
                    <strong>Lütfen aşağıdaki alanları doldurun:</strong>
                    <ul class="mt-2 mb-0">
                        ${errors.map(error => `<li>${error}</li>`).join('')}
                    </ul>
                </div>
            `;
            modal.show();
            return;
        }

        // Form verilerini oluştur
        const formData = new FormData();
        formData.append('IgUserId', document.getElementById('IgUserId').value);
        formData.append('AccessToken', document.getElementById('AccessToken').value);
        formData.append('SystemPrompt', document.getElementById('SystemPrompt').value);
        formData.append('UserPrompt', document.getElementById('UserPrompt').value);
        formData.append('date', document.getElementById('date').value);
        formData.append('shareType', shareTypeSelect.value);
        formData.append('selectedTimes', JSON.stringify(selectedTimes));

        // Görselleri ekle
        uploadedFiles.forEach((file, index) => {
            formData.append(`image_${index}`, file);
        });

        // Gönderim
        fetch("{% url 'asistan:instagram_agents_start' %}", {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error('Sunucu hatası');
            return response.json();
        })
        .then(data => {
            modalBody.innerHTML = `<div class="alert alert-success">Form başarıyla gönderildi.</div>`;
            modal.show();
            // İsteğe bağlı: Yönlendirme, formu sıfırlama vs.
        })
        .catch(error => {
            modalBody.innerHTML = `<div class="alert alert-danger">Gönderim sırasında bir hata oluştu: ${error.message}</div>`;
            modal.show();
        });
    });
</script>
