{% load static %}
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ATXAISOFT.COM</title>
    <meta name="csrf-token" content="{{ csrf_token }}">

    <link rel="icon" type="image/x-icon" href="{% static 'atxaisoft/ai24.png' %}">
    {% comment %} <link rel="stylesheet" href="{% static 'js/agents.js' %}"> {% endcomment %}
    {% comment %} <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet"> {% endcomment %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>

    {% include 'components/navbar.html' %}
    <div id="responsesContainer" class="mt-4"></div>

    <div class="container d-flex justify-content-center align-items-center" style="height: 50vh;">
      <!-- Message div'i başlangıçta gizlendi -->
      
      <form class="w-100" id="aiForm">
      <div id="message" class="mt-3 p-3 border rounded bg-light border-0 text-center" style="display: none;"></div>

        <div class="form-floating mb-3">
          <textarea class="form-control" placeholder="Bir şey yaz..." id="floatingTextarea2" style="height: 100px"></textarea>
          <label for="floatingTextarea2">Bir şey yaz...</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Gönder</button>
        
      </form>
    </div>
    

    {% include 'components/footer.html' %}

    <script>
      document.getElementById("aiForm").addEventListener("submit", function (event) {
        event.preventDefault();
    
        const input = document.getElementById("floatingTextarea2").value.trim();
        const message = document.getElementById("message");
        const responsesContainer = document.getElementById("responsesContainer");
        responsesContainer.innerHTML = "";
    
        if (!input) {
          message.innerHTML = "Lütfen bir şey yazın.";
          message.style.display = "block";
          return;
        }
    
        message.innerHTML = "Yanıtlar geliyor...";
        message.style.display = "block";
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    
        fetch("{% url 'asistan:agents_process' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": csrfToken
          },
          body: `input=${encodeURIComponent(input)}`
        })
    
          .then(response => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
    
            function read() {
              return reader.read().then(({ done, value }) => {
                if (done) return;
    
                const chunk = decoder.decode(value, { stream: true });
                const parts = chunk.split("\n\n");  // SSE standardı
    
                for (const part of parts) {
                  if (part.startsWith("data: ")) {
                    const jsonString = part.replace("data: ", "");
                    const data = JSON.parse(jsonString);
    
                    const card = document.createElement("div");
                    card.className = "card mb-2 container";
                    card.innerHTML = `
                      <div class="card-body ">
                        <h5 class="card-title">${data.emoji} ${formatAgentName(data.agent)}</h5>
                        <p class="card-text"></p>
                      </div>
                    `;
                    responsesContainer.appendChild(card);
    
                    const textElement = card.querySelector(".card-text");
                    typeWriterEffect(textElement, data.response, 50);  // kelime kelime efekt
                  }
                }
    
                return read(); // recursive: sürekli oku
              });
            }
    
            return read();
          })
          .catch(error => {
            console.error("Hata:", error);
            message.innerHTML = "Bir hata oluştu.";
          });
      });
    
      function formatAgentName(agent) {
        return agent.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }
    
      function typeWriterEffect(element, text, delay = 50) {
        element.innerHTML = "";
        let i = 0;
        const words = text.split(" ");
        function type() {
          if (i < words.length) {
            element.innerHTML += words[i] + " ";
            i++;
            setTimeout(type, delay);
          }
        }
        type();
      }
    </script>
    
    
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
  </body>
</html>
